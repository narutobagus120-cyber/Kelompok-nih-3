<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heyyow - Biodata Syela</title>
    <style>
        /* Desain tampilan halaman (CSS) */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        h1 {
            color: #4a90e2;
            margin-bottom: 5px;
        }
        h2 {
            font-size: 1.2rem;
            color: #777;
            margin-top: 0;
            font-weight: 400;
        }
        .bio-text {
            font-size: 1.1rem;
            margin: 10px 0;
            background: #eef2f7;
            padding: 10px;
            border-radius: 8px;
        }
        h3 {
            text-align: left;
            color: #333;
            border-bottom: 2px solid #4a90e2;
            padding-bottom: 5px;
            margin-top: 25px;
        }
        ul {
            text-align: left;
            padding-left: 20px;
            line-height: 1.8;
            margin-bottom: 0;
        }
    </style>
</head>
<body>

    <!-- Struktur Konten (HTML) -->
    <div class="card">
        <h1>Hai halo! 👋</h1>
        <h2>Perkenalan Diri</h2>
        
        <div class="bio-text">
            <strong>Syela</strong><br>
            <span style="color: #666; font-size: 0.9rem;">Kelas 12 PPLG 1</span>
        </div>

        <h3>Kegemaran saya ✨</h3>
        <ul>
            <li>🎵 Mendengarkan musik</li>
            <li>☁️ Melihat langit</li>
            <li>🎧 Menonton ASMR</li>
        </ul>
    </div>

</body>
</html>
